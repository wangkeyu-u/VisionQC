name: visionqc

x-edge-gateway-base: &edge-gateway-base
  build:
    context: ..
    dockerfile: edge-gateway/Dockerfile
  depends_on:
    api:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: visionqc
      POSTGRES_USER: visionqc
      POSTGRES_PASSWORD: visionqc-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionqc -d visionqc"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: visionqc
      MINIO_ROOT_PASSWORD: visionqc-local-minio
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 visionqc visionqc-local-minio &&
        mc mb --ignore-existing local/visionqc
    restart: "no"

  mock-external:
    build:
      context: ../backend
    command: ["uvicorn", "app.mock_external:app", "--host", "0.0.0.0", "--port", "8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/mes/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8081:8081"

  api:
    build:
      context: ../backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &backend-environment
      VQC_ENVIRONMENT: demo
      VQC_DATABASE_URL: postgresql+psycopg://visionqc:visionqc-local-only@postgres:5432/visionqc
      VQC_AUTH_SECRET: visionqc-local-jwt-secret-change-me
      VQC_STORAGE_BACKEND: s3
      VQC_S3_ENDPOINT_URL: http://minio:9000
      VQC_S3_BUCKET: visionqc
      VQC_S3_ACCESS_KEY: visionqc
      VQC_S3_SECRET_KEY: visionqc-local-minio
      VQC_MES_BASE_URL: http://mock-external:8081/mes
      VQC_QMS_BASE_URL: http://mock-external:8081/qms
      VQC_DEPLOYMENT_MANIFEST_DIR: /app/deployment-packs/examples
      VQC_BOOTSTRAP_TENANT_IDS: factory-a,factory-b,duerr-demo,example-electronics,example-packaging,example-automotive-paint
      VQC_DEMO_SWITCHABLE_TENANT_IDS: factory-a,factory-b,duerr-demo,example-electronics,example-packaging,example-automotive-paint
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mock-external:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  worker:
    build:
      context: ../backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_USE_MOCKS: "false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3000:8080"

  edge-gateway-a:
    build:
      context: ..
      dockerfile: edge-gateway/Dockerfile
    command: ["uvicorn", "edge_gateway.main:app", "--host", "0.0.0.0", "--port", "8091"]
    environment:
      VQC_GATEWAY_MODE: demo
      VQC_GATEWAY_VERSION: 0.1.0
      VQC_GATEWAY_ID: factory-a-gw-st07
      VQC_GATEWAY_BACKEND_URL: http://api:8000/api/v1
      VQC_GATEWAY_PACK_PATH: /app/configs/factory-a-transistor.json
      VQC_GATEWAY_DATA_DIR: /var/lib/visionqc-gateway
      VQC_GATEWAY_WATCH_ROOT: /var/lib/visionqc-gateway/incoming
      VQC_GATEWAY_STATUS_PORT: 8091
      VQC_GATEWAY_AUTH_SECRET: visionqc-local-jwt-secret-change-me
      VQC_GATEWAY_AUTH_ISSUER: visionqc
    volumes:
      - edge-gateway-a-data:/var/lib/visionqc-gateway
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8091:8091"

  edge-gateway-b:
    build:
      context: ..
      dockerfile: edge-gateway/Dockerfile
    command: ["uvicorn", "edge_gateway.main:app", "--host", "0.0.0.0", "--port", "8092"]
    environment:
      VQC_GATEWAY_MODE: demo
      VQC_GATEWAY_VERSION: 0.1.0
      VQC_GATEWAY_ID: factory-b-gw-cell12
      VQC_GATEWAY_BACKEND_URL: http://api:8000/api/v1
      VQC_GATEWAY_PACK_PATH: /app/configs/factory-b-bottle.json
      VQC_GATEWAY_DATA_DIR: /var/lib/visionqc-gateway
      VQC_GATEWAY_WATCH_ROOT: /var/lib/visionqc-gateway/incoming
      VQC_GATEWAY_STATUS_PORT: 8092
      VQC_GATEWAY_AUTH_SECRET: visionqc-local-jwt-secret-change-me
      VQC_GATEWAY_AUTH_ISSUER: visionqc
    volumes:
      - edge-gateway-b-data:/var/lib/visionqc-gateway
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8092:8092"

  edge-gateway-duerr:
    build:
      context: ..
      dockerfile: edge-gateway/Dockerfile
    command: ["uvicorn", "edge_gateway.main:app", "--host", "0.0.0.0", "--port", "8093"]
    environment:
      VQC_GATEWAY_MODE: demo
      VQC_GATEWAY_VERSION: 0.1.0
      VQC_GATEWAY_ID: duerr-demo-gw-paint-qc
      VQC_GATEWAY_BACKEND_URL: http://api:8000/api/v1
      VQC_GATEWAY_PACK_PATH: /app/configs/duerr-demo-paint-quality.json
      VQC_GATEWAY_DATA_DIR: /var/lib/visionqc-gateway
      VQC_GATEWAY_WATCH_ROOT: /var/lib/visionqc-gateway/incoming
      VQC_GATEWAY_STATUS_PORT: 8093
      VQC_GATEWAY_AUTH_SECRET: visionqc-local-jwt-secret-change-me
      VQC_GATEWAY_AUTH_ISSUER: visionqc
      VQC_GATEWAY_UPLOAD_ENABLED: "true"
      VQC_GATEWAY_DATA_CONSENT: "true"
      VQC_GATEWAY_QUALITY_FAILURE_MODE: SAFE_REVIEW
    volumes:
      - edge-gateway-duerr-data:/var/lib/visionqc-gateway
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8093:8093"
    profiles: ["customer-concept"]

  # One clear environment-controlled entry point.  Change only
  # VQC_GATEWAY_PACK_PATH (and, for a customer pack, VQC_GATEWAY_ID) to run a
  # different tenant/site without changing application code.
  edge-gateway-selected:
    <<: *edge-gateway-base
    command:
      ["uvicorn", "edge_gateway.main:app", "--host", "0.0.0.0", "--port", "${VQC_GATEWAY_STATUS_PORT:-8090}"]
    environment:
      VQC_GATEWAY_MODE: ${VQC_GATEWAY_MODE:-demo}
      VQC_GATEWAY_VERSION: ${VQC_GATEWAY_VERSION:-0.1.0}
      VQC_GATEWAY_ID: ${VQC_GATEWAY_ID:-gateway-local}
      VQC_GATEWAY_BACKEND_URL: ${VQC_GATEWAY_BACKEND_URL:-http://api:8000/api/v1}
      VQC_GATEWAY_PACK_PATH: ${VQC_GATEWAY_PACK_PATH:-/app/configs/examples/electronics-transistor/resolved-deployment-pack.json}
      VQC_GATEWAY_DATA_DIR: ${VQC_GATEWAY_DATA_DIR:-/var/lib/visionqc-gateway}
      VQC_GATEWAY_WATCH_ROOT: ${VQC_GATEWAY_WATCH_ROOT:-/var/lib/visionqc-gateway/incoming}
      VQC_GATEWAY_STATUS_PORT: ${VQC_GATEWAY_STATUS_PORT:-8090}
      VQC_GATEWAY_AUTH_SECRET: ${VQC_GATEWAY_AUTH_SECRET:-visionqc-local-jwt-secret-change-me}
      VQC_GATEWAY_AUTH_ISSUER: ${VQC_GATEWAY_AUTH_ISSUER:-visionqc}
      VQC_GATEWAY_UPLOAD_ENABLED: ${VQC_GATEWAY_UPLOAD_ENABLED:-false}
      VQC_GATEWAY_DATA_CONSENT: ${VQC_GATEWAY_DATA_CONSENT:-false}
    volumes:
      - edge-gateway-selected-data:/var/lib/visionqc-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${VQC_GATEWAY_STATUS_PORT:-8090}/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${VQC_GATEWAY_STATUS_PORT:-8090}:${VQC_GATEWAY_STATUS_PORT:-8090}"

  # Deterministic three-industry examples used for onboarding and smoke tests.
  # They are opt-in so the default demo remains small; see
  # docs/PLATFORM-QUICKSTART.md for the command.
  edge-gateway-electronics-example:
    <<: *edge-gateway-base
    command: ["uvicorn", "edge_gateway.main:app", "--host", "0.0.0.0", "--port", "8094"]
    environment:
      VQC_GATEWAY_MODE: demo
      VQC_GATEWAY_VERSION: 0.1.0
      VQC_GATEWAY_ID: example-electronics-gateway
      VQC_GATEWAY_BACKEND_URL: http://api:8000/api/v1
      VQC_GATEWAY_PACK_PATH: /app/configs/examples/electronics-transistor/resolved-deployment-pack.json
      VQC_GATEWAY_DATA_DIR: /var/lib/visionqc-gateway
      VQC_GATEWAY_WATCH_ROOT: /var/lib/visionqc-gateway/incoming
      VQC_GATEWAY_STATUS_PORT: 8094
      VQC_GATEWAY_AUTH_SECRET: visionqc-local-jwt-secret-change-me
      VQC_GATEWAY_AUTH_ISSUER: visionqc
      VQC_GATEWAY_UPLOAD_ENABLED: "false"
      VQC_GATEWAY_DATA_CONSENT: "false"
    volumes:
      - edge-gateway-electronics-example-data:/var/lib/visionqc-gateway
    profiles: ["industry-examples"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8094/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8094:8094"

  edge-gateway-packaging-example:
    <<: *edge-gateway-base
    command: ["uvicorn", "edge_gateway.main:app", "--host", "0.0.0.0", "--port", "8095"]
    environment:
      VQC_GATEWAY_MODE: demo
      VQC_GATEWAY_VERSION: 0.1.0
      VQC_GATEWAY_ID: example-packaging-gateway
      VQC_GATEWAY_BACKEND_URL: http://api:8000/api/v1
      VQC_GATEWAY_PACK_PATH: /app/configs/examples/packaging-bottle/resolved-deployment-pack.json
      VQC_GATEWAY_DATA_DIR: /var/lib/visionqc-gateway
      VQC_GATEWAY_WATCH_ROOT: /var/lib/visionqc-gateway/incoming
      VQC_GATEWAY_STATUS_PORT: 8095
      VQC_GATEWAY_AUTH_SECRET: visionqc-local-jwt-secret-change-me
      VQC_GATEWAY_AUTH_ISSUER: visionqc
      VQC_GATEWAY_UPLOAD_ENABLED: "false"
      VQC_GATEWAY_DATA_CONSENT: "false"
    volumes:
      - edge-gateway-packaging-example-data:/var/lib/visionqc-gateway
    profiles: ["industry-examples"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8095:8095"

  edge-gateway-automotive-paint-example:
    <<: *edge-gateway-base
    command: ["uvicorn", "edge_gateway.main:app", "--host", "0.0.0.0", "--port", "8096"]
    environment:
      VQC_GATEWAY_MODE: demo
      VQC_GATEWAY_VERSION: 0.1.0
      VQC_GATEWAY_ID: example-automotive-paint-gateway
      VQC_GATEWAY_BACKEND_URL: http://api:8000/api/v1
      VQC_GATEWAY_PACK_PATH: /app/configs/examples/automotive-paint/resolved-deployment-pack.json
      VQC_GATEWAY_DATA_DIR: /var/lib/visionqc-gateway
      VQC_GATEWAY_WATCH_ROOT: /var/lib/visionqc-gateway/incoming
      VQC_GATEWAY_STATUS_PORT: 8096
      VQC_GATEWAY_AUTH_SECRET: visionqc-local-jwt-secret-change-me
      VQC_GATEWAY_AUTH_ISSUER: visionqc
      VQC_GATEWAY_UPLOAD_ENABLED: "false"
      VQC_GATEWAY_DATA_CONSENT: "false"
    volumes:
      - edge-gateway-automotive-paint-example-data:/var/lib/visionqc-gateway
    profiles: ["industry-examples"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8096/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8096:8096"

  edge-simulator-a:
    build:
      context: ..
      dockerfile: edge-gateway/Dockerfile
    command: ["python", "-m", "edge_gateway.simulator", "--pack", "/app/configs/factory-a-transistor.json", "--root", "/var/lib/visionqc-gateway/incoming", "--continuous", "--interval", "5"]
    volumes:
      - edge-gateway-a-data:/var/lib/visionqc-gateway
    profiles: ["simulator"]

  edge-simulator-b:
    build:
      context: ..
      dockerfile: edge-gateway/Dockerfile
    command: ["python", "-m", "edge_gateway.simulator", "--pack", "/app/configs/factory-b-bottle.json", "--root", "/var/lib/visionqc-gateway/incoming", "--continuous", "--interval", "7"]
    volumes:
      - edge-gateway-b-data:/var/lib/visionqc-gateway
    profiles: ["simulator"]

  edge-simulator-duerr:
    build:
      context: ..
      dockerfile: edge-gateway/Dockerfile
    command: ["python", "-m", "edge_gateway.simulator", "--pack", "/app/configs/duerr-demo-paint-quality.json", "--root", "/var/lib/visionqc-gateway/incoming", "--continuous", "--interval", "7"]
    volumes:
      - edge-gateway-duerr-data:/var/lib/visionqc-gateway
    profiles: ["simulator", "customer-concept"]

volumes:
  postgres-data:
  minio-data:
  edge-gateway-a-data:
  edge-gateway-b-data:
  edge-gateway-duerr-data:
  edge-gateway-selected-data:
  edge-gateway-electronics-example-data:
  edge-gateway-packaging-example-data:
  edge-gateway-automotive-paint-example-data:
