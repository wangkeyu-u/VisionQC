[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "visionqc-ml"
version = "0.1.0"
description = "Reproducible PatchCore baseline and offline evaluation workflow for VisionQC"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary project code; third-party data and model licenses apply separately" }
dependencies = [
  "numpy==2.1.3",
  "pillow==11.1.0",
  "pydantic==2.10.6",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "scipy==1.15.1",
]

[project.optional-dependencies]
model = [
  "anomalib[core]==2.0.0",
  "python-dotenv==1.0.1",
  "requests==2.32.5",
  "torch==2.6.0",
  "torchvision==0.21.0",
]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.6",
]

[project.scripts]
visionqc-ml = "visionqc_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visionqc_ml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "model: requires the optional Anomalib/PyTorch runtime",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["visionqc_ml"]
warn_unused_ignores = true
ignore_missing_imports = true
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["import-untyped"]
