schema_version: visionqc.training-config.v1
seed: 20260804
model:
  id: patchcore-bottle
  version: 2.3.0
  feature_bank_version: fb-bottle-20260802
  adapter: anomalib.patchcore.v2
  anomalib_version: 2.0.0
  backbone: resnet50
  layers:
    - layer2
    - layer3
  pretrained: true
  coreset_sampling_ratio: 0.05
  num_neighbors: 7
preprocessing:
  color_mode: RGB
  resize:
    height: 320
    width: 320
    interpolation: bilinear
    antialias: true
  center_crop:
    height: 288
    width: 288
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  input_constraints:
    min_width: 64
    min_height: 64
    max_pixels: 40000000
data:
  category: bottle
  source_config: configs/mvtec-ad-bottle.json
  validation_ratio: 0.5
  train_batch_size: 8
  eval_batch_size: 8
  num_workers: 0
calibration:
  policy_version: factory-b-bottle-policy-2.1.0
  max_false_accept_rate: 0.0
  target_hold_recall: 0.9
  strategy: legacy
  safety_margin: 0.0
performance:
  warmup_runs: 3
  measured_runs: 10
  warm_p95_target_ms: 3000
runtime:
  accelerator: auto
  devices: 1
  deterministic: true
