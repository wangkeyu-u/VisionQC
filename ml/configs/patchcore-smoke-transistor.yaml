schema_version: visionqc.training-config.v1
seed: 20260804
model:
  id: patchcore-transistor-smoke
  version: 0.0.1-smoke
  feature_bank_version: fb-transistor-smoke
  adapter: anomalib.patchcore.v2
  anomalib_version: 2.0.0
  backbone: resnet18
  layers: [layer2, layer3]
  pretrained: false
  coreset_sampling_ratio: 0.2
  num_neighbors: 1
preprocessing:
  color_mode: RGB
  resize: {height: 64, width: 64, interpolation: bilinear, antialias: true}
  center_crop: {height: 56, width: 56}
  normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  input_constraints: {min_width: 16, min_height: 16, max_pixels: 100000}
data:
  category: transistor
  source_config: configs/mvtec-ad-transistor.json
  validation_ratio: 0.5
  train_batch_size: 2
  eval_batch_size: 2
  num_workers: 0
calibration:
  policy_version: factory-a-transistor-policy-smoke
  max_false_accept_rate: 0.5
  target_hold_recall: 0.5
  strategy: legacy
  safety_margin: 0.0
performance:
  warmup_runs: 1
  measured_runs: 1
  warm_p95_target_ms: 3000
runtime:
  accelerator: cpu
  devices: 1
  deterministic: true
