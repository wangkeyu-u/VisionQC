[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "visionqc-backend"
version = "0.1.0"
description = "VisionQC quality workflow backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "pillow>=10.4,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "pyjwt>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: API and database integration tests",
  "e2e: end-to-end quality workflow tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
